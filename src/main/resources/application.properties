spring.application.name=meditrack-backend

# --- MySQL connection ---
spring.datasource.url=jdbc:mysql://localhost:3306/meditrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=meditrack_user
spring.datasource.password=meditrack_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update = auto-creates/updates tables from your @Entity classes on startup.
# Good for development; in a real production app you'd use migrations (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080

# --- JWT ---
# In a real app, NEVER hardcode a secret like this in a committed file.
# This should come from an environment variable. We'll cover that when we get to deployment.
jwt.secret=${JWT_SECRET:meditrackSuperSecretKeyForJWTSigningMustBeAtLeast256BitsLongForHS256Algorithm}\
jwt.expiration.ms=86400000
